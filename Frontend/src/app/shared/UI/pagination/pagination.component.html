<div class="pagination">
  <button (click)="change(page - 1)" [disabled]="page === 1">‹</button>

  <button
    *ngFor="let p of [].constructor(totalPages); let i = index"
    (click)="change(i + 1)"
    [class.active]="page === i + 1"
  >
    {{ i + 1 }}
  </button>

  <button (click)="change(page + 1)" [disabled]="page === totalPages">›</button>
</div>
