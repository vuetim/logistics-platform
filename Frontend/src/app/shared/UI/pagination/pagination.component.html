<div class="pagination">
  <button (click)="change(page - 1)" [disabled]="page <= 1">&lt;</button>

  <button
    *ngFor="let p of pages"
    (click)="change(p)"
    [class.active]="page === p"
  >
    {{ p }}
  </button>

  <button (click)="change(page + 1)" [disabled]="page >= safeTotalPages">&gt;</button>
</div>
