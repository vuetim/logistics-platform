<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Create User</h2>
      <app-ui-button variant="ghost" (click)="cancel()" [disabled]="loading"
        >✕</app-ui-button
      >
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Full Name</label>
        <input [(ngModel)]="fullName" [disabled]="loading" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="email" type="email" [disabled]="loading" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input [(ngModel)]="password" type="password" [disabled]="loading" />
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="role" [disabled]="loading">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <app-ui-button variant="ghost" (click)="cancel()" [disabled]="loading">
        Cancel
      </app-ui-button>

      <app-ui-button
        variant="primary"
        (click)="save()"
        [disabled]="loading || !fullName || !email || !password"
      >
        {{ loading ? "Creating..." : "Create User" }}
      </app-ui-button>
    </div>
  </div>
</div>
