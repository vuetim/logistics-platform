<div class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>Create load</h2>
        <p>{{ order.orderNumber }} · {{ order.origin || '-' }} to {{ order.destination || '-' }}</p>
      </div>
    </div>

    <div class="form-grid">
      <div>
        <label>Carrier</label>
        <select [(ngModel)]="model.carrierId">
          <option value="">No carrier yet</option>
          <option *ngFor="let carrier of carriers" [value]="carrier.id">
            {{ carrier.name }}
          </option>
        </select>
      </div>

      <div>
        <label>Carrier rate</label>
        <input type="number" min="0" step="0.01" [(ngModel)]="model.carrierRate" />
      </div>

      <div>
        <label>Planned pickup</label>
        <input type="datetime-local" [(ngModel)]="model.plannedPickupDate" />
      </div>

      <div>
        <label>Planned delivery</label>
        <input type="datetime-local" [(ngModel)]="model.plannedDeliveryDate" />
      </div>

      <div class="full">
        <label>Rate confirmation #</label>
        <input [(ngModel)]="model.rateConfirmationNumber" />
      </div>
    </div>

    <div class="hint">
      Stops, items, equipment, and customer accessorials are copied from the order.
    </div>

    <div class="actions">
      <button type="button" class="secondary" (click)="cancel()">Cancel</button>
      <button type="button" class="primary" (click)="submit()">Create Load</button>
    </div>
  </div>
</div>
